name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Publish Dual Editions (Standalone and Lightweight)
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        New-Item -ItemType Directory -Path "./artifacts" -Force

        # 1. Standalone (~100MB, Self-Contained)
        dotnet publish radiant-noether.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o "./publish_standalone"
        $dirStandalone = "RescenePomodoro-$tag-Standalone-win-x64"
        New-Item -ItemType Directory -Path $dirStandalone -Force
        Copy-Item "./publish_standalone/RescenePomodoro.exe" -Destination "$dirStandalone/"
        Copy-Item "./publish_standalone/RescenePomodoro.exe" -Destination "./artifacts/RescenePomodoro-Standalone.exe"
        Copy-Item "./Images" -Destination "$dirStandalone/" -Recurse
        Copy-Item "./Sounds" -Destination "$dirStandalone/" -Recurse
        Copy-Item "./README.md" -Destination "$dirStandalone/"
        Copy-Item "./실행하기.bat" -Destination "$dirStandalone/" -ErrorAction SilentlyContinue
        Compress-Archive -Path "$dirStandalone/*" -DestinationPath "./artifacts/RescenePomodoro-$tag-Standalone-win-x64.zip" -Force

        # 2. Lightweight (~15MB, Framework-Dependent)
        dotnet publish radiant-noether.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o "./publish_lightweight"
        $dirLightweight = "RescenePomodoro-$tag-Lightweight-win-x64"
        New-Item -ItemType Directory -Path $dirLightweight -Force
        Copy-Item "./publish_lightweight/RescenePomodoro.exe" -Destination "$dirLightweight/"
        Copy-Item "./publish_lightweight/RescenePomodoro.exe" -Destination "./artifacts/RescenePomodoro-Lightweight.exe"
        Copy-Item "./Images" -Destination "$dirLightweight/" -Recurse
        Copy-Item "./Sounds" -Destination "$dirLightweight/" -Recurse
        Copy-Item "./README.md" -Destination "$dirLightweight/"
        Copy-Item "./실행하기.bat" -Destination "$dirLightweight/" -ErrorAction SilentlyContinue
        Compress-Archive -Path "$dirLightweight/*" -DestinationPath "./artifacts/RescenePomodoro-$tag-Lightweight-win-x64.zip" -Force

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: RESCENE Pomodoro Pet ${{ github.ref_name }}
        draft: false
        prerelease: false
        body_path: RELEASE_NOTES.md
        generate_release_notes: false
        files: |
          ./artifacts/*
