name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Publish Single-File Executable
      run: |
        dotnet publish radiant-noether.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o ./publish

    - name: Package Release ZIP
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        $distDir = "RescenePomodoro-$tag-win-x64"
        New-Item -ItemType Directory -Path $distDir -Force

        Copy-Item -Path "./publish/RescenePomodoro.exe" -Destination "$distDir/"
        Copy-Item -Path "./Images" -Destination "$distDir/" -Recurse
        Copy-Item -Path "./Sounds" -Destination "$distDir/" -Recurse
        Copy-Item -Path "./README.md" -Destination "$distDir/"
        Copy-Item -Path "./실행하기.bat" -Destination "$distDir/" -ErrorAction SilentlyContinue

        Compress-Archive -Path "$distDir/*" -DestinationPath "RescenePomodoro-$tag-win-x64.zip" -Force

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: RESCENE Pomodoro Pet ${{ github.ref_name }}
        draft: false
        prerelease: false
        body_path: RELEASE_NOTES.md
        generate_release_notes: false
        files: |
          ./publish/RescenePomodoro.exe
          ./RescenePomodoro-*.zip
